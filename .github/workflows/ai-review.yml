name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    name: AI Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.issue.state == 'open' &&
       contains(github.event.comment.body, '@berget') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                github.event.comment.author_association))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: >-
            ${{
              github.event.pull_request.head.sha ||
              (github.event.issue.pull_request && format('refs/pull/{0}/merge', github.event.issue.number)) ||
              github.sha
            }}

      # The PR under review must not control the reviewer's instructions:
      # always use the system prompt from main, never the PR's own copy.
      # (First bootstrap: if the prompt is not on main yet, the PR copy in
      # this very PR is the trusted source — it becomes main on merge.)
      - name: Use trusted system prompt from main
        run: |
          if git cat-file -e "refs/remotes/origin/main:.github/prompts/review-system.md" 2>/dev/null; then
            git show "refs/remotes/origin/main:.github/prompts/review-system.md" \
              > .github/prompts/review-system.md
            echo "Using system prompt from origin/main"
          else
            echo "Prompt not on main yet — falling back to PR copy (bootstrap)"
          fi

      - uses: berget-ai/ai-review-action@1400f87fac1db96181eea507e7d86997d6c02ba1 # v1.3 (@berget trigger)
        with:
          api_key: ${{ secrets.BERGET_API_KEY }}
          approve: 'true'
          github_app_id: ${{ secrets.AI_REVIEW_APP_ID }}
          github_app_private_key: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}
          use_dora: 'false'
          system_prompt: '.github/prompts/review-system.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
