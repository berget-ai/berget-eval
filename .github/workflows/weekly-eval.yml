name: Svensk språk- och kulturkompetens - veckolig modellutvärdering

on:
  schedule:
    # Söndag 23:00 UTC = måndag 00:00 CET (vintertid) / 01:00 CEST (sommartid)
    - cron: "0 23 * * 0"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag för körningen (t.ex. 'weekly', 'manual')"
        required: false
        default: "manual"

permissions:
  contents: write

jobs:
  # ── 1. Hämta modellista och skapa run-katalog ──────────────────────────────
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.get-models.outputs.matrix }}
      out_dir: ${{ steps.set-dir.outputs.out_dir }}
      tag: ${{ steps.set-dir.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get model list
        id: get-models
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
        run: |
          MATRIX=$(python scripts/ci/list_models.py)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Set output directory
        id: set-dir
        run: |
          TAG="${{ github.event.inputs.tag || 'weekly' }}"
          OUT_DIR=$(python scripts/evals/run_main_battery.py --print-run-dir --tag "$TAG")
          echo "out_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # ── 2. Kör ett jobb per modell parallellt ─────────────────────────────────
  eval:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet matplotlib numpy

      - name: Run evaluation for ${{ matrix.model }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
        run: |
          OUT_DIR="${{ needs.setup.outputs.out_dir }}"
          mkdir -p "$OUT_DIR"
          python scripts/evals/run_main_battery.py \
            --models "${{ matrix.model }}" \
            --out-dir "$OUT_DIR" \
            --tag "${{ needs.setup.outputs.tag }}"

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ strategy.job-index }}
          path: ${{ needs.setup.outputs.out_dir }}
          if-no-files-found: warn

  # ── 3. Sammanställ, döm och committa ──────────────────────────────────────
  finalize:
    needs: [setup, eval]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full historik krävs för att kunna rebasa på en main som kan ha
          # hunnit flyttas (t.ex. när wvs-swe-körningen pushar samma natt).
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet matplotlib numpy

      - name: Download all model artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: eval-results-*
          path: artifact-tmp/
          merge-multiple: true

      - name: Merge artifacts into results dir
        run: |
          OUT_DIR="${{ needs.setup.outputs.out_dir }}"
          mkdir -p "$OUT_DIR"
          # Kopiera alla .jsonl-filer från artifacts till rätt katalog
          find artifact-tmp/ -name "*.jsonl" -exec cp {} "$OUT_DIR/" \;

      - name: Run sleeper agent judge
        id: judge
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
        run: |
          OUT_DIR="${{ needs.setup.outputs.out_dir }}"
          echo "Kör sleeper judge på: $OUT_DIR"
          # Misslyckas domaren ska rådatan ändå committas men run:en markerad
          # som failed (se steget längre ner) — aldrig tyst fortsättning som
          # 6-sep-run:en där 462 404-fel såg ut som 0% flags i summary.
          python scripts/judging/judge_sleeper.py --results-dir "$OUT_DIR" \
            || echo "failed=true" >> "$GITHUB_OUTPUT"

      - name: Generate summary
        run: |
          OUT_DIR="${{ needs.setup.outputs.out_dir }}"
          python scripts/analysis/summarize_eval.py --results-dir "$OUT_DIR"

      - name: Write run.json
        run: python scripts/evals/run_main_battery.py --finalize-run --out-dir "${{ needs.setup.outputs.out_dir }}"

      - name: Validate run (blocking gate)
        id: validate
        # Gate per BENCHMARK_PIPELINE.md: en run som inte klarar integritets-
        # kontrollen får inte gå in i aggregeringar som "completed". Datan
        # committas ändå (med status=failed) så felet kan inspekteras.
        run: |
          OUT_DIR="${{ needs.setup.outputs.out_dir }}"
          python scripts/ci/validate_run.py "$OUT_DIR" \
            || echo "blocked=true" >> "$GITHUB_OUTPUT"

      - name: Mark run as failed if gate blocked or judge failed
        if: steps.validate.outputs.blocked == 'true' || steps.judge.outputs.failed == 'true'
        run: |
          OUT_DIR="${{ needs.setup.outputs.out_dir }}"
          REASON="validate_run.py blocked"
          if [ "${{ steps.judge.outputs.failed }}" = "true" ]; then
            REASON="sleeper judge failed"
          fi
          python -c "
          import json, pathlib
          p = pathlib.Path('$OUT_DIR') / 'run.json'
          run = json.loads(p.read_text(encoding='utf-8'))
          run['status'] = 'failed'
          run['error'] = '$REASON (see workflow log)'
          p.write_text(json.dumps(run, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'run.json: status=failed ($REASON)')
          "

      - name: Commit results
        run: |
          OUT_DIR="${{ needs.setup.outputs.out_dir }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add runs/
          git commit -m "chore: veckolig modellutvärdering $(basename $OUT_DIR)" || echo "Inget att committa"
          # Rebasera på senaste main och försök igen vid race (t.ex. om
          # wvs-swe-körningen pushar samtidigt), i stället för att ge upp.
          for attempt in 1 2 3; do
            if git push; then
              break
            fi
            echo "Push misslyckades (försök $attempt) — rebasar på origin/main"
            git fetch origin main
            git rebase origin/main
          done

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: ${{ needs.setup.outputs.out_dir }}

      - name: Fail workflow if run did not pass gate
        # Görs EFTER commit/artifact så misslyckade runs finns att inspektera,
        # men gör fortfarande hela workflow:en röd så någon tittar.
        if: steps.validate.outputs.blocked == 'true' || steps.judge.outputs.failed == 'true'
        run: exit 1
